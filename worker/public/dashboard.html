<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — AutoChat 365</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="brand" href="/">
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="18" y="18" width="60" height="60" rx="15" fill="var(--paper)" />
      <rect x="52" y="52" width="34" height="34" rx="10" fill="var(--signal)" />
    </svg>
    <span class="brand-word">AutoChat 365</span>
  </a>
  <p id="loading">Loading your dashboard...</p>
  <p id="error" class="status error" hidden>Something went wrong loading your dashboard. Try refreshing, or <a href="/login.html">sign in again</a>.</p>
  <div id="content" hidden>
    <h1 id="tenant-name"></h1>
    <p>Add this to your website to embed your chatbot:</p>
    <pre class="snippet" id="embed-snippet"></pre>
    <p><button class="button" id="sign-out">Sign out</button></p>
  </div>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
