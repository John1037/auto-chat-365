<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Documents — AutoChat 365</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="app">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="18" y="18" width="60" height="60" rx="15" fill="var(--paper)" />
        <rect x="52" y="52" width="34" height="34" rx="10" fill="var(--signal)" />
      </svg>
      <span class="brand-word">AutoChat 365</span>
    </a>
    <nav class="topbar-actions">
      <a class="topbar-link" href="#" id="sign-out">Log out</a>
      <a class="avatar" href="/settings.html" aria-label="Your profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="currentColor" />
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor" />
        </svg>
      </a>
    </nav>
  </header>
  <div class="app-shell">
    <nav class="sidebar">
      <details class="sidebar-item">
        <summary>Widgets</summary>
        <a href="/dashboard.html">All widgets</a>
        <div class="sidebar-widget-list" id="sidebar-widget-list"></div>
        <a href="/widget-new.html">New widget</a>
      </details>
      <details class="sidebar-item" open>
        <summary>Knowledge Base</summary>
        <a href="/knowledge-base.html" class="active">Review Documents</a>
        <a href="/knowledge-base-embed.html">Embed Document</a>
        <a href="/knowledge-base-analysis.html">Analysis</a>
      </details>
      <details class="sidebar-item">
        <summary>Settings</summary>
        <a href="/settings.html">Overview</a>
      </details>
    </nav>
    <main class="workspace">
      <h1>Review Documents</h1>
      <p><a href="/knowledge-base-embed.html" class="button">Embed a document</a></p>
      <p id="doc-empty" hidden>No documents yet. Embed your first one to get started.</p>
      <div class="doc-list" id="doc-list"></div>
    </main>
  </div>

  <dialog class="edit-dialog" id="edit-dialog">
    <form id="edit-form">
      <label>Title
        <input type="text" id="edit-title" required />
      </label>
      <label>Content
        <textarea id="edit-content" rows="14" required></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" class="button-outline" id="edit-cancel">Cancel</button>
        <button type="submit" class="button">Save</button>
      </div>
    </form>
  </dialog>

  <dialog class="edit-dialog" id="visibility-dialog">
    <form id="visibility-form">
      <p>Which widgets can this document answer questions for?</p>
      <label class="radio-label">
        <input type="radio" name="visibility-scope" value="global" id="visibility-global" />
        All widgets
      </label>
      <label class="radio-label">
        <input type="radio" name="visibility-scope" value="selected" id="visibility-selected" />
        Only selected widgets
      </label>
      <div id="visibility-widget-list" class="checkbox-list"></div>
      <div class="dialog-actions">
        <button type="button" class="button-outline" id="visibility-cancel">Cancel</button>
        <button type="submit" class="button">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/knowledge-base-review.js"></script>
</body>
</html>
