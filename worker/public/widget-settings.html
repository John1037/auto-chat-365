<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widget Settings — AutoChat 365</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="app">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="18" y="18" width="60" height="60" rx="15" fill="var(--paper)" />
        <rect x="52" y="52" width="34" height="34" rx="10" fill="var(--signal)" />
      </svg>
      <span class="brand-word">AutoChat 365</span>
    </a>
    <nav class="topbar-actions">
      <a class="topbar-link" href="#" id="sign-out">Log out</a>
      <a class="avatar" href="/settings.html" aria-label="Your profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="currentColor" />
          <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor" />
        </svg>
      </a>
    </nav>
  </header>
  <div class="app-shell">
    <nav class="sidebar">
      <details class="sidebar-item" open>
        <summary>Widgets</summary>
        <a href="/dashboard.html">All widgets</a>
        <div class="sidebar-widget-list" id="sidebar-widget-list"></div>
        <a href="/widget-new.html">New widget</a>
      </details>
      <details class="sidebar-item">
        <summary>Knowledge Base</summary>
        <a href="/knowledge-base.html">Review Documents</a>
        <a href="/knowledge-base-embed.html">Embed Document</a>
        <a href="/knowledge-base-analysis.html">Analysis</a>
      </details>
      <details class="sidebar-item">
        <summary>Settings</summary>
        <a href="/settings.html">Overview</a>
      </details>
    </nav>
    <main class="workspace">
      <h1 id="page-heading">Widget settings</h1>
      <p id="loading">Loading...</p>
      <p id="error" class="status error" hidden>Couldn't find that widget.</p>
      <div id="content" hidden>
        <form id="settings-form">
          <label>Widget name <span class="field-hint">(shown to you, not visitors)</span>
            <input type="text" id="name-input" required />
          </label>
          <label>Chatbot name <span class="field-hint">(shown to visitors -- not used yet)</span>
            <input type="text" id="chatbot-name-input" placeholder="Assistant" />
          </label>
          <label>Chat title <span class="field-hint">(replaces "Chat with us")</span>
            <input type="text" id="chat-title-input" required />
          </label>
          <label>Header logo <span class="field-hint">(image URL -- replaces the default mark in the widget's top bar)</span>
            <input type="text" id="logo-url-input" placeholder="https://example.com/logo.png" />
          </label>
          <div class="field-row">
            <label>Color scheme <span class="field-hint">(accent -- send button, your messages)</span>
              <input type="color" id="color-input" />
            </label>
            <label>Top bar background
              <input type="color" id="header-color-input" />
            </label>
          </div>
          <div class="field-row">
            <label>Position
              <select id="position-input">
                <option value="bottom-right">Bottom right</option>
                <option value="bottom-left">Bottom left</option>
              </select>
            </label>
            <label>Horizontal offset (px)
              <input type="number" id="offset-x-input" min="0" max="400" required />
            </label>
            <label>Vertical offset (px)
              <input type="number" id="offset-y-input" min="0" max="400" required />
            </label>
          </div>
          <label>Allowed origins <span class="field-hint">(one per line, e.g. https://example.com)</span>
            <textarea id="origins-input" rows="4"></textarea>
          </label>
          <button class="button" type="submit">Save settings</button>
          <p class="status" id="save-status"></p>
        </form>

        <h2>Embed snippet</h2>
        <p>Add this to your website to embed this widget:</p>
        <pre class="snippet" id="embed-snippet"></pre>
      </div>
    </main>
  </div>
  <script type="module" src="/widget-settings.js"></script>
</body>
</html>
