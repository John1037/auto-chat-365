<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — AutoChat 365</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="brand" href="/">
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="18" y="18" width="60" height="60" rx="15" fill="var(--paper)" />
      <rect x="52" y="52" width="34" height="34" rx="10" fill="var(--signal)" />
    </svg>
    <span class="brand-word">AutoChat 365</span>
  </a>
  <h1>Sign in</h1>
  <p>Enter your email and we'll send you a link to sign in — no password needed.</p>
  <form id="login-form">
    <input type="email" id="email" name="email" placeholder="you@yourbusiness.com" required autocomplete="email" />
    <button class="button" type="submit">Send sign-in link</button>
  </form>
  <p class="status" id="status"></p>
  <script type="module" src="/login.js"></script>
</body>
</html>
