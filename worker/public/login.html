<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Chat365</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Sign in</h1>
  <p>Enter your email and we'll send you a link to sign in — no password needed.</p>
  <form id="login-form">
    <input type="email" id="email" name="email" placeholder="you@yourbusiness.com" required autocomplete="email" />
    <button class="button" type="submit">Send sign-in link</button>
  </form>
  <p class="status" id="status"></p>
  <script type="module" src="/login.js"></script>
</body>
</html>
